apiVersion: v1
kind: Namespace
metadata:
  name: go-httpbin
  labels:
    app.kubernetes.io/name: go-httpbin
    app.kubernetes.io/part-of: go-httpbin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-httpbin
  namespace: go-httpbin
  labels:
    app.kubernetes.io/name: go-httpbin
    app.kubernetes.io/part-of: go-httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-httpbin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-httpbin
        app.kubernetes.io/part-of: go-httpbin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: go-httpbin
          image: ghcr.io/vancanhuit/go-httpbin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADDR
              value: ":8080"
            - name: LOG_LEVEL
              value: info
            - name: TRUST_PROXY_HEADERS
              value: "true"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: go-httpbin
  namespace: go-httpbin
  labels:
    app.kubernetes.io/name: go-httpbin
    app.kubernetes.io/part-of: go-httpbin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: go-httpbin
  ports:
    - name: http
      port: 80
      targetPort: http
