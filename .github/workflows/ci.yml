name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --verbose

      - name: Generate OpenAPI server
        run: go generate ./...

      - name: Check generated code
        run: git diff --exit-code

      - name: Lint and format
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Test
        run: go test -v -cover -race ./...

      - name: Compute build version
        id: build-version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            version="pr-${PR_NUMBER}-${short_sha}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            version="main-${short_sha}"
          else
            version="${GITHUB_REF_NAME}-${short_sha}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Set up kind
        if: github.event_name == 'pull_request'
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.31.0
          kubectl_version: v1.35.0
          cluster_name: go-httpbin-ci
          wait: 120s

      - name: Verify Kubernetes manifest with kind
        if: github.event_name == 'pull_request'
        env:
          KIND_CREATE_CLUSTER: "false"
          KIND_IMAGE_VERSION: ${{ steps.build-version.outputs.version }}
        run: scripts/verify-kind.sh

      - name: Install cloud-provider-kind
        if: github.event_name == 'pull_request'
        run: |
          go install sigs.k8s.io/cloud-provider-kind@v0.10.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify Gateway API with cloud-provider-kind
        if: github.event_name == 'pull_request'
        env:
          KIND_CREATE_CLUSTER: "false"
          KIND_IMAGE_VERSION: ${{ steps.build-version.outputs.version }}
        run: scripts/verify-gateway-api.sh

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-platform container image
        if: github.event_name == 'pull_request'
        env:
          BUILD_VERSION: ${{ steps.build-version.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${BUILD_VERSION}" \
            --tag go-httpbin:ci \
            --tag "go-httpbin:${BUILD_VERSION}" \
            --output=type=oci,dest=/tmp/go-httpbin-image.tar \
            .

      - name: Archive PR container image
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: go-httpbin-oci-image
          path: /tmp/go-httpbin-image.tar
          if-no-files-found: error
          retention-days: 7

      - name: Publish multi-platform container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BUILD_VERSION: ${{ steps.build-version.outputs.version }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${BUILD_VERSION}" \
            --tag "${IMAGE_REPOSITORY}:latest" \
            --tag "${IMAGE_REPOSITORY}:main" \
            --tag "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            --tag "${IMAGE_REPOSITORY}:${BUILD_VERSION}" \
            --push \
            .
